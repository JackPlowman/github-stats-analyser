[project]
name = "github-stats-analyser"
dynamic = ["version"]
requires-python = "~=3.14.0"
dependencies = [
  "gitpython==3.2.1",
  "pygithub==2.10.0",
  "structlog==26.1.0",
  "pygments==2.21.0",
  "pandas==3.1.0",
  "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
  "vulture==2.16",
  "ty==0.0.91",
]
test = [
  "check-jsonschema==0.38.2",
  "requests==2.34.2",
  "Markdown==3.11.2",
  "beautifulsoup4==4.15.0",
]

[tool.uv]
required-version = "~=0.13.0"
package = false

[tool.setuptools]
py-modules = ["analyser", "tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E501"]
select = ["ALL"]

ignore = [
  "CPY001",  # Copyright is documented in LICENCE rather than per-file headers
  "COM812",  # Ignore due to conflict with Ruff formatter
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "D100",    # Ignore missing docstring in public module
  "N999",    # Ignore invalid module name
  "SIM112",  # Ignore Lowercase environment variables (used for GitHub actions)
]

fixable = ["ALL"]
unfixable = []

exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**test_*.py" = ["S101", "D102", "D103", "SLF001", "PT019"]
"python_scripts/*.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["analyser"]

[tool.pytest.ini_options]
norecursedirs = "cloned_repositories"

[tool.vulture]
ignore_names = ["side_effect", "file_paths"]
